interface:
  display_name: "Miku Score"
  short_description: "Score conversion and AI handoff workflow for miku-score"
  default_prompt: "Use $igapyon-miku-score for miku-score-specific score conversion, rendering, diagnostics, AI handoff, and CLI workflows. Formal triggers are igapyon-miku-score, miku-score, and miku-score-skills; mikuscore and mikuscore-skills remain compatibility triggers for this same skill. Do not trigger from MusicXML, ABC, MIDI, MuseScore, MEI, LilyPond, VSQX, xml, or score-conversion words alone. Prefer agent-internal execution and the vendored miku-score CLI before generic advice. Keep the product contract explicit: MusicXML is the canonical score source and ABC is the current AI-facing full-score boundary. Prefer vendor/miku-score/docs/spec/* over README-level summaries on conflict. In bundled installs, use skills/igapyon-miku-score/vendor/miku-score. Put generated state, output, and temporary artifacts under miku-score/state/, miku-score/output/, and miku-score/tmp/ unless the user specifies another location."
